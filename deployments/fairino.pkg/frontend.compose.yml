services:
  # The server runs in the host's network namespace, so Caddy cannot reach it on caddy-ingress.
  # This stub only carries the route (like cockpit.pkg); Caddy also reads stopped containers.
  reverse-proxy-config:
    image: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command: sh -c 'sleep 60'
    networks:
      - caddy-ingress
    labels:
      caddy: http://
      caddy.redir: /fairino /fairino/
      caddy.handle_path: /fairino/*
      caddy.handle_path.reverse_proxy: host.docker.internal:8091

networks:
  caddy-ingress:
    external: true
